<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cannibisters Wheel of Fortune</title>
    <style>
:root {
    --bg-color: #121212;
    --card-bg: #1e1e1e;
    --primary-color: #00ff00;
    /* Neon Green */
    --secondary-color: #ff00ff;
    --text-color: #ffffff;
    --text-muted: #aaaaaa;
    --font-main: 'Outfit', sans-serif;
}

body {
    background-color: var(--bg-color);
    color: var(--text-color);
    font-family: var(--font-main);
    margin: 0;
    padding: 0;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    overflow: hidden;
}

.app-container {
    width: 100%;
    max-width: 500px;
    height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 20px;
    box-sizing: border-box;
    position: relative;
}

/* Header */
header {
    text-align: center;
    margin-bottom: 2rem;
    z-index: 10;
}

.logo-img {
    max-width: 250px;
    height: auto;
    /* Monochrome white filter */
    filter: brightness(0) invert(1) drop-shadow(0 0 5px rgba(255, 255, 255, 0.3));
    margin-bottom: 0;
}

.subtitle {
    font-size: 1.2rem;
    color: var(--text-muted);
    margin: 5px 0 0 0;
    text-transform: uppercase;
    letter-spacing: 1px;
}

/* Screens */
.screen {
    width: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    transition: opacity 0.5s ease;
    flex: 1;
}

.hidden {
    display: none !important;
    opacity: 0;
    pointer-events: none;
}

/* Tier Selection */
#tier-selection h2 {
    margin-bottom: 30px;
    font-weight: 300;
}

.tier-buttons {
    display: flex;
    flex-direction: column;
    gap: 20px;
    width: 100%;
}

.tier-btn {
    background: linear-gradient(145deg, #2a2a2a, #1a1a1a);
    border: 1px solid #333;
    border-radius: 12px;
    padding: 20px;
    cursor: pointer;
    display: flex;
    justify-content: space-between;
    align-items: center;
    transition: all 0.3s ease;
    box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
}

.tier-btn:hover {
    border-color: var(--primary-color);
    transform: translateY(-2px);
    box-shadow: 0 0 15px rgba(0, 255, 0, 0.2);
}

.tier-name {
    font-size: 1.5rem;
    font-weight: 700;
    color: var(--text-color);
}

.tier-amount {
    font-size: 1rem;
    color: var(--primary-color);
    font-weight: 500;
}

/* Wheel Screen */
.back-btn {
    align-self: flex-start;
    background: none;
    border: none;
    color: var(--text-muted);
    font-size: 1rem;
    cursor: pointer;
    margin-bottom: 20px;
}

.back-btn:hover {
    color: var(--primary-color);
}

.wheel-container {
    position: relative;
    width: 350px;
    height: 350px;
    margin: 20px auto;
    /* Box shadow on the container, not the wheel, to avoid rotation glitches */
    border-radius: 50%;
    box-shadow: 0 0 20px rgba(0, 0, 0, 0.5);
    /* Border acts as the rim */
    border: 5px solid #333;
    box-sizing: content-box;
    /* Ensure 350px is the content */
}

.pointer {
    position: absolute;
    top: -25px;
    /* Adjust based on arrow size */
    left: 50%;
    transform: translateX(-50%);
    width: 0;
    height: 0;
    border-left: 15px solid transparent;
    border-right: 15px solid transparent;
    border-top: 30px solid var(--primary-color);
    z-index: 10;
    filter: drop-shadow(0 0 5px var(--primary-color));
}

.wheel {
    width: 100%;
    height: 100%;
    border-radius: 50%;
    position: relative;
    overflow: hidden;
    transition: transform 4s cubic-bezier(0.15, 0, 0.2, 1);
    /* Conic gradient is set in JS */
}

/* 
   New Text Styling based on polar coordinates.
   The text element itself will be centered in the wheel (0,0 of the wheel).
*/
.wheel-text {
    position: absolute;
    /* Center the element exactly */
    top: 50%;
    left: 50%;
    /* No width/height here; let content define it or fix it if needed */
    /* If we want text to flow left-to-right from center, we can just center it and translate */
    transform-origin: 0 0;
    /* Not strictly needed if we use center-center positioning logic, but let's stick to standard flow */

    font-size: 0.8rem;
    font-weight: 700;
    color: #fff;
    text-transform: capitalize;
    text-shadow: 1px 1px 3px rgba(0, 0, 0, 0.8);
    pointer-events: none;
    white-space: nowrap;

    /* We will set transform in JS: rotate(...) translate(...) */
    /* IMPORTANT: To center the "start" of the text vertically on the radius line: */
    display: flex;
    align-items: center;
}

.spin-btn-center {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 80px;
    height: 80px;
    background: radial-gradient(circle at 30% 30%, #ffffff, var(--primary-color));
    color: #000;
    border: 4px solid #fff;
    border-radius: 50%;
    font-size: 1.2rem;
    font-weight: 800;
    cursor: pointer;
    box-shadow: 0 0 15px rgba(0, 0, 0, 0.5), 0 0 20px rgba(0, 255, 0, 0.6);
    z-index: 20;
    display: flex;
    justify-content: center;
    align-items: center;
    transition: transform 0.2s, box-shadow 0.2s;
    text-transform: uppercase;
}

.spin-btn-center:active {
    transform: translate(-50%, -50%) scale(0.95);
}

.spin-btn-center:disabled {
    background: #444;
    border-color: #666;
    color: #888;
    box-shadow: inset 0 0 10px #000;
    cursor: not-allowed;
}

/* Modal */
.modal {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(0, 0, 0, 0.8);
    display: flex;
    justify-content: center;
    align-items: center;
    z-index: 100;
    backdrop-filter: blur(5px);
}

.modal-content {
    background: var(--card-bg);
    padding: 40px;
    border-radius: 20px;
    text-align: center;
    border: 1px solid #333;
    box-shadow: 0 0 30px rgba(0, 255, 0, 0.2);
    animation: popIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    max-width: 90%;
}

@keyframes popIn {
    from {
        transform: scale(0.8);
        opacity: 0;
    }

    to {
        transform: scale(1);
        opacity: 1;
    }
}

.prize-text {
    font-size: 2rem;
    color: var(--primary-color);
    font-weight: 700;
    margin: 20px 0;
    text-transform: uppercase;
}

.claim-btn {
    background: transparent;
    border: 2px solid var(--primary-color);
    color: var(--primary-color);
    padding: 10px 30px;
    border-radius: 30px;
    font-size: 1rem;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.3s;
}

.claim-btn:hover {
    background: var(--primary-color);
    color: #000;
}

.modal-buttons {
    display: flex;
    gap: 15px;
    justify-content: center;
    margin-top: 20px;
}

.claim-btn.secondary {
    border-color: #fff;
    color: #fff;
}

.claim-btn.secondary:hover {
    background: #fff;
    color: #000;
}


@media (max-width: 400px) {
    .wheel-container {
        width: 300px;
        height: 300px;
    }
}

            <!-- <h1 class="logo-text">CANNIBISTERS</h1> -->
            <p class="subtitle">Wheel of Fortune</p>
        </header>

        <!-- Tier Selection Screen -->
        <div id="tier-selection" class="screen active">
            <h2>Select Your Spend Tier</h2>
            <div class="tier-buttons">
                <button class="tier-btn" onclick="selectTier('silver')">
                    <span class="tier-name">Silver</span>
                    <span class="tier-amount">R1500+</span>
                </button>
                <button class="tier-btn" onclick="selectTier('gold')">
                    <span class="tier-name">Gold</span>
                    <span class="tier-amount">R2500+</span>
                </button>
                <button class="tier-btn" onclick="selectTier('platinum')">
                    <span class="tier-name">Platinum</span>
                    <span class="tier-amount">R3500+</span>
                </button>
            </div>
        </div>

        <!-- Wheel Screen -->
        <div id="wheel-screen" class="screen hidden">
            <button class="back-btn" onclick="resetToTiers()">← Back</button>
            <div class="wheel-container">
                <div class="pointer"></div>
                <div class="wheel" id="wheel">
                    <!-- Segments will be injected by JS -->
                </div>
                <!-- Spin button is now the central hub -->
                <button id="spin-btn" class="spin-btn-center" onclick="spinWheel()">SPIN</button>
            </div>
        </div>

        <!-- Result Modal -->
        <div id="result-modal" class="modal hidden">
            <div class="modal-content">
                <h2>Congratulations!</h2>
                <p>You won:</p>
                <div id="result-prize" class="prize-text"></div>
                <div class="modal-buttons">
                    <button class="claim-btn secondary" onclick="spinAgain()">Spin Again</button>
                    <button class="claim-btn" onclick="resetToTiers()">Claim Prize</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <script>
// Tier Data Configuration
const tiers = {
    silver: {
        name: "Silver (1500+)",
        color: "#C0C0C0", // Silver
        prizes: [
            "Free Pre-Roll",
            "5% Off Purchase",
            "Glass Pipe",
            "Lighter",
            "One Hit Wonder Puff",
            "Exclusive Strain Sample",
            "5,000 Loyalty Points",
            "Canni Water",
            "Hot or Cold Drink",
            "Snack (Chips/Choc)"
        ]
    },
    gold: {
        name: "Gold (2500+)",
        color: "#FFD700", // Gold
        prizes: [
            "10% Off Purchase",
            "Exclusive Strain Sample",
            "One Hit Wonder Puff",
            "One Hit Wonder Capsule",
            "Bucket Hat",
            "Free Pre-Roll",
            "10,000 Loyalty Points",
            "Hot/Cold Infused Drink",
            "Snack (Chips/Choc)",
            "Lighter"
        ]
    },
    platinum: {
        name: "Platinum (3500+)",
        color: "#E5E4E2", // Platinum
        prizes: [
            "Infused Drink",
            "Exclusive Strain Sample",
            "Bucket Hat",
            "15% Off Purchase",
            "15,000 Loyalty Points",
            "Free Moonstick",
            "30mg Rosin Capsule",
            "20mg Edibles",
            "Dab Hit",
            "Free Pre-Roll Indoor"
        ]
    }
};

// State
let currentTier = null;
let isSpinning = false;
let wheelRotation = 0;

// DOM Elements
const tierSelectionScreen = document.getElementById('tier-selection');
const wheelScreen = document.getElementById('wheel-screen');
const wheelElement = document.getElementById('wheel');
const resultModal = document.getElementById('result-modal');
const resultPrizeText = document.getElementById('result-prize');
const spinBtn = document.getElementById('spin-btn');

// -- Functions --

function selectTier(tierKey) {
    currentTier = tiers[tierKey];
    showScreen(wheelScreen);
    setupWheel();
}

function showScreen(screenElement) {
    document.querySelectorAll('.screen').forEach(el => el.classList.add('hidden'));
    screenElement.classList.remove('hidden');
}

function resetToTiers() {
    currentTier = null;
    isSpinning = false;
    wheelRotation = 0;
    wheelElement.style.transition = 'none';
    wheelElement.style.transform = `rotate(0deg)`;
    resultModal.classList.add('hidden');
    spinBtn.disabled = false;
    showScreen(tierSelectionScreen);
}

function setupWheel() {
    wheelElement.innerHTML = ''; // Clear existing
    const prizeCount = currentTier.prizes.length;
    const sliceAngle = 360 / prizeCount;

    // 1. Create Conic Gradient Background
    let gradientParts = [];
    currentTier.prizes.forEach((_, index) => {
        const start = index * sliceAngle;
        const end = (index + 1) * sliceAngle;
        const color = index % 2 === 0 ? '#2a2a2a' : '#1a1a1a';
        gradientParts.push(`${color} ${start}deg ${end}deg`);
    });
    wheelElement.style.background = `conic-gradient(${gradientParts.join(', ')})`;

    // 2. Add Text Labels using Polar Coordinates
    const wheelRadius = wheelElement.clientWidth / 2;
    // We want the text to start partially out from center to avoid clutter at pivot
    const textOffset = wheelRadius * 0.15;

    currentTier.prizes.forEach((prize, index) => {
        const textEl = document.createElement('div');
        textEl.classList.add('wheel-text');
        textEl.textContent = prize;

        // Calculate the center angle of the slice
        // Slice 0 starts at 0deg (Top, due to conic-gradient standard) to sliceAngle.
        // Center is (index + 0.5) * sliceAngle.
        const midAngle = (index + 0.5) * sliceAngle;

        // Transform Logic:
        // 1. Rotate to align with the slice angle.
        //    Standard CSS Text flow is Horizontal (0deg = Right).
        //    We want Text flow to point UP (0deg = Top) if we didn't rotate. 
        //    So `rotate(-90deg)` aligns text to Point "Up".
        //    Then `rotate(midAngle)` points it to the slice direction.
        //    Total Rotation `R = midAngle - 90`.
        // 
        // 2. Translate OUT along that direction.
        //    `translate(radius)` happens in the local rotated coordinate system.
        // 
        // So: `rotate(R) translate(offset)` should work.

        textEl.style.transform = `rotate(${midAngle - 90}deg) translate(${wheelRadius * 0.55}px)`; // Translate to mid-radius roughly

        // Fix for readability? 
        // If the text is upside down (angles 90-270), we might want to flip it?
        // Usually wheel text reads from center outward, so it's always "sideways" but consistent.
        // The user prompted: "Each prize label MUST be perfectly centred on the midline of its slice."

        wheelElement.appendChild(textEl);
    });
}

function spinWheel() {
    if (isSpinning) return;
    isSpinning = true;
    spinBtn.disabled = true;

    const prizeCount = currentTier.prizes.length;
    const sliceAngle = 360 / prizeCount;

    // 1. Random Selection
    const randomIndex = Math.floor(Math.random() * prizeCount);
    const selectedPrize = currentTier.prizes[randomIndex];

    // 2. Calculate Rotation
    // Target is mid-line of the selected slice.
    // Pointer is at Top (0deg).
    // Slice `randomIndex` center is at `(randomIndex + 0.5) * sliceAngle`.
    const midAngle = (randomIndex + 0.5) * sliceAngle;

    const spinCount = 5 + Math.floor(Math.random() * 5); // 5-10 spins
    const jitter = (Math.random() - 0.5) * (sliceAngle * 0.2); // Keep jitter small to hit near center

    // We want to arrive at a rotation R such that:
    // (RotatedWheel Angle at Top) = midAngle ? No.
    // If Wheel is at 0deg, Slice 0 is at Top.
    // If we want Slice X at Top, we must rotate Wheel by -AngleOfSliceX.

    // Target position: -midAngle (CCW rotation brings angle to top).
    // We want CW spinning (positive).
    // So target = 360*spins + (360 - midAngle).

    let targetRotation = 360 * spinCount + (360 - midAngle) + jitter;

    // Add to current rotation to keep continuous
    // We need to calculate the *delta* needed. 
    // Just adding `targetRotation` to `wheelRotation` isn't enough, 
    // because `wheelRotation` effectively holds our current "zero".

    // Better approach:
    // Reset internal tracker to 0-360 representation? No, visual glitch.

    // `currentAbsRotation = wheelRotation`.
    // We want final `wheelRotation` to satisfy `wheelRotation % 360 == (360 - midAngle)`.

    // `nextRotation = wheelRotation + minSpins + delta`
    const currentMod = wheelRotation % 360;
    // We want to get to `targetMod = 360 - midAngle`.
    // Distance forward = (targetMod - currentMod + 360) % 360.

    const rotationNeeded = (360 - midAngle - currentMod + 360) % 360;
    const totalRotation = wheelRotation + (360 * spinCount) + rotationNeeded + jitter;

    wheelRotation = totalRotation;

    // Apply CSS
    // Re-enable transition (in case it was removed by reset)
    wheelElement.style.transition = 'transform 4s cubic-bezier(0.15, 0, 0.2, 1)';
    wheelElement.style.transform = `rotate(${wheelRotation}deg)`;

    // 3. Show Result
    setTimeout(() => {
        isSpinning = false;
        resultPrizeText.textContent = selectedPrize;
        resultModal.classList.remove('hidden');
        fireConfetti();
    }, 4000);
}

function spinAgain() {
    isSpinning = false;
    spinBtn.disabled = false;
    resultModal.classList.add('hidden');
    // We do NOT reset rotation here, so it spins naturally from current position
}

function fireConfetti() {
    confetti({
        particleCount: 150,
        spread: 70,
        origin: { y: 0.6 },
        colors: [currentTier.color, '#ffffff', '#00ff00']
    });
}

</script>
