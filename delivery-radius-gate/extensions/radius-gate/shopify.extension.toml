api_version = "2026-07"

[[extensions]]
name = "radius-gate"
handle = "radius-gate"
type = "function"
description = "Gates the 25km Cape Town delivery rates on measured distance from the shop."

  [[extensions.targeting]]
  target = "cart.delivery-options.transform.run"
  input_query = "src/run.graphql"
  export = "run"

  # No build command: the CLI detects this as a JavaScript function from
  # src/index.js and compiles it itself (esbuild bundle -> javy -> wasm).
  # The entry point MUST be src/index.js — the CLI looks only there, and any
  # other filename makes it fall through to the "needs a build command" path.
  [extensions.build]
  command = ""
  path = "dist/index.wasm"
